# Aeron REST API v1 ingestion worker (Bearer AERON_API_KEY). Same image as the
# API; no browser. Use together with compose.yaml, which defines postgres.
# Exactly one replica: extra copies exit on the PostgreSQL advisory lock.
services:
  environment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.environment.worker"]

    environment:
      APP_ENV: development
      DATABASE_URL: ${MICROCOSM_DATABASE_URL:-postgresql+psycopg://microcosm_app:microcosm_dev_only@postgres:5432/microcosm_clean_20260922}
      LOG_LEVEL: INFO

      AERON_STATION_ID: ${AERON_STATION_ID:?AERON_STATION_ID is required}
      AERON_API_BASE_URL: ${AERON_API_BASE_URL:-https://live3.aeronsystems.com/api/v1}
      AERON_API_KEY: ${AERON_API_KEY:?AERON_API_KEY is required}
      AERON_POLL_INTERVAL_SECONDS: ${AERON_POLL_INTERVAL_SECONDS:-300}
      AERON_CONNECT_TIMEOUT_SECONDS: ${AERON_CONNECT_TIMEOUT_SECONDS:-5}
      AERON_READ_TIMEOUT_SECONDS: ${AERON_READ_TIMEOUT_SECONDS:-15}
      AERON_MAX_ATTEMPTS: ${AERON_MAX_ATTEMPTS:-3}

    depends_on:
      postgres:
        condition: service_healthy

    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
