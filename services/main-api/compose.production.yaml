name: sustainability-production

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sustainability_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      # Must match the certificate volume below. The application default is a
      # relative directory, which is not this mount.
      CERTIFICATE_STORAGE_ROOT: /app/certificate-storage
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/sustainability-data/evidence/quarantine:/data/evidence/quarantine
      - /opt/sustainability-data/evidence/clean:/data/evidence/clean
      - /opt/sustainability-data/certificate-storage:/app/certificate-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  environment-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  sustainability_postgres_data:
